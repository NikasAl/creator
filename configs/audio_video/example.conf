# Конфигурация для пайплайна Аудио → Видео
# NotebookLM подкаст, интервью, обсуждение

# Исходный аудио файл (опционально — если не указан, будет выбран через fzf)
# AUDIO_FILE="/path/to/podcast.mp3"

# Каталог вывода
BASE_DIR="pipelines_audio_video/my_podcast"

# Название (для обложки и метаданных)
TITLE="Мой подкаст"

# Язык транскрибации
LANGUAGE="ru"

# Количество тематических сегментов
SEGMENTS_COUNT="10"

# Визуальный стиль иллюстраций
STYLE="Реалистичный"

# Секунд на одну иллюстрацию (для расчёта количества)
SECONDS_PER_ILLUSTRATION="20"